run_id: deep_regen_20260731
experiment: DeepRegen
experiment_name: GLM-5.2 deep regeneration with full DB context + multi-round repair
description: |
  For blind-spot failures, use GLM-5.2 to regenerate SQL from scratch with
  schema + column samples + FK graph + evidence, then execute + repair up to
  3 rounds. Fresh generation (not candidate reselection). Compliant.
dataset:
  name: BIRD
  split: dev
  source: /home/dameng/bird_dev/dev.json
  db_root: /home/dameng/bird_dev/dev_databases
model:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
execution:
  timeout_seconds: 30
  max_rows: 100
output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
compliance:
  no_gold_in_prompt: true
