run_id: e6_preference_guided_20260731
experiment: E6
experiment_name: Preference-guided regeneration with question analysis
description: |
  For failures, use DeepSeek-V4-Flash to regenerate SQL with a preference-guided prompt.
  Step 1: analyze what the question asks for (columns, aggregation, format).
  Step 2: write SQL following BIRD annotation preferences learned from train.
  Compliant: train-derived rules only, no dev gold.
dataset:
  name: BIRD
  split: dev
  source: data/dev.json
  db_root: data/dev_databases
model:
  provider: openai-compatible
  base_url: https://api.deepseek.com
  model_name: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
prompt:
  template: prompts/e6_preference_guided.md
execution:
  timeout_seconds: 30
  max_rows: 100
output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
compliance:
  no_gold_in_prompt: true
