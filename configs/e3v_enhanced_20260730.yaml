run_id: e3v_enhanced_20260730
experiment: E3v+
experiment_name: Enhanced Value Probe (LIKE + date format) on current-chain failures
description: |
  Enhanced value grounding with LIKE-pattern detection (suggest = -> LIKE when
  no exact match but prefix/substring match exists) and date-format detection
  (suggest year()/strftime() when question mentions a year). Compliant.
dataset:
  name: BIRD
  split: dev
  source: data/dev.json
  db_root: data/dev_databases
model:
  provider: openai-compatible
  base_url: https://api.deepseek.com
  model_name: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
prompt:
  template: prompts/e3v_value_grounding.md
execution:
  timeout_seconds: 30
  max_rows: 100
output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
compliance:
  no_gold_in_prompt: true
