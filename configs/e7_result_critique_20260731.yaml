run_id: e7_result_critique_20260731
experiment: E7
experiment_name: Result-aware self-critique on failures
description: |
  For each failure, show DeepSeek-V4-Flash the draft SQL + its actual execution result,
  ask it to analyze whether the result correctly answers the question.
  This catches "non-empty but wrong" results that E4 (exec repair) misses.
  Compliant: no gold, only execution output.
dataset:
  name: BIRD
  split: dev
  source: data/dev.json
  db_root: data/dev_databases
model:
  provider: openai-compatible
  base_url: https://api.deepseek.com
  model_name: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
prompt:
  template: prompts/e7_result_critique.md
execution:
  timeout_seconds: 30
  max_rows: 100
output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
compliance:
  no_gold_in_prompt: true
