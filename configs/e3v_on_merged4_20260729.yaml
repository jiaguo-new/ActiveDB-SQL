run_id: e3v_on_merged4_20260729
experiment: E3v
experiment_name: Active-Probe Value Grounding on merged4-ORM failures
description: |
  E3v value grounding agent applied to merged4 ORM-band selector failures (466 q),
  using merged4 predictions as the draft SQL (not GLM base). Compliant.
dataset:
  name: BIRD
  split: dev
  source: data/dev.json
  db_root: data/dev_databases
model:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
prompt:
  template: prompts/e3v_value_grounding.md
value_grounding:
  sample_limit: 200
execution:
  timeout_seconds: 30
  max_rows: 100
agent:
  max_repairs: 0
output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
compliance:
  no_gold_in_prompt: true
  no_test_data: true
