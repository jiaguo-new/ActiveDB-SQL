run_id: e3c_v2_column_grounding_20260730
experiment: E3c-v2
experiment_name: Enhanced Column Grounding (COUNT/DISTINCT/agg/extra-col checks)
description: |
  Enhanced E3c with post-loop checks: COUNT(*) anywhere in SELECT (including
  complex expressions), missing aggregation (lowest->MIN), missing DISTINCT,
  extra columns detection. Applied to current-chain failures. Compliant.
dataset:
  name: BIRD
  split: dev
  source: data/dev.json
  db_root: data/dev_databases
model:
  provider: openai-compatible
  base_url: https://api.z.ai/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
prompt:
  template: prompts/e3c_column_grounding.md
execution:
  timeout_seconds: 30
  max_rows: 100
output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
compliance:
  no_gold_in_prompt: true
