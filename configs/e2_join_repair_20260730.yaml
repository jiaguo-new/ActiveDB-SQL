run_id: e2_join_repair_20260730
experiment: E2
experiment_name: FK-graph JOIN repair + denoising agent on merged4+E3v+E4 failures
description: |
  For each merged4+E3v+E4 failure question, build the FK graph, diagnose JOIN
  topology (under/over-JOIN) + execution noise (empty/large/dup), feed the
  draft + noise report + FK-correct JOIN path to GLM-5.2 for correction.
  Pick best candidate (valid+non-empty, no gold). Compliant.
dataset:
  name: BIRD
  split: dev
  source: data/dev.json
  db_root: data/dev_databases
model:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
prompt:
  template: prompts/e2_join_repair.md
execution:
  timeout_seconds: 30
  max_rows: 100
output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
compliance:
  no_gold_in_prompt: true
