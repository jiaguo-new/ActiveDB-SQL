# Experiment G: Full 12 plugins + all tuning ported
# Target: 1210+ (match old tuned pipeline)
#
# Tuning ported from old fixed pipeline:
# 1. route_a judge: system prompt + checklist + max_tokens=1024 (already in plugin)
# 2. judge_3way: 3-way simultaneous judge (new plugin)
# 3. Double regen: deep_regen runs twice (2nd pass on remaining failures)
llm:
  base_url: https://api.deepseek.com
  model_name: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
  timeout: 120
data:
  dev: data/dev.json
  db_root: data/dev_databases
plugins:
  # ── Stage 1: Select ──
  - stage: select
    name: orm_band
    module: plugins.select.orm_band
    config:
      pool: runs/merged4model_n4_clean_scored_20260805.jsonl
      band: 0.05

  # ── Stage 2: Repair (6 plugins) ──
  - stage: repair
    name: value_grounding
    module: plugins.repair.value_grounding
  - stage: repair
    name: execution_repair
    module: plugins.repair.execution_repair
    config:
      max_repairs: 2
  - stage: repair
    name: join_repair
    module: plugins.repair.join_repair
  - stage: repair
    name: column_grounding
    module: plugins.repair.column_grounding
  - stage: repair
    name: e3v_enhanced
    module: plugins.repair.e3v_enhanced
  - stage: repair
    name: e5_det_rules
    module: plugins.repair.e5_det_rules

  # ── Stage 3: Judge (3 plugins: pairwise + 3way + multigen) ──
  - stage: judge
    name: route_a_tournament
    module: plugins.judge.route_a
    config:
      pool: runs/merged4model_n8_pool_scored_20260729.jsonl
      top_k: 12
      max_tokens: 1024
  - stage: judge
    name: judge_3way
    module: plugins.judge.judge_3way
    config:
      pool: runs/merged4model_n8_pool_scored_20260729.jsonl
      top_k: 8
  - stage: judge
    name: multigen
    module: plugins.judge.multigen
    config:
      pool: runs/triple_merged_scored_pool.jsonl

  # ── Stage 4: Regen (3 plugins, deep_regen twice) ──
  - stage: regen
    name: deep_regen_pass1
    module: plugins.regen.deep_regen
    config:
      max_repairs: 3
  - stage: regen
    name: preference_guided
    module: plugins.regen.preference_guided
  - stage: regen
    name: result_critique
    module: plugins.regen.result_critique
  - stage: regen
    name: deep_regen_pass2
    module: plugins.regen.deep_regen
    config:
      max_repairs: 2
