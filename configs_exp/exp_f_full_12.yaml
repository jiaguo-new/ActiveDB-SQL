# Full pipeline: all 12 plugins (DeepSeek-V4-Flash)
# Target: match or exceed old fixed pipeline 1210 (78.88%)

llm:
  base_url: https://api.deepseek.com
  model_name: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
  timeout: 120

data:
  dev: data/dev.json
  db_root: data/dev_databases

plugins:
  # Stage 1: Candidate Selection
  - stage: select
    name: orm_band
    module: plugins.select.orm_band
    config:
      pool: runs/merged4model_n4_clean_scored_20260805.jsonl
      band: 0.05

  # Stage 2: Repair (6 plugins, order matters)
  - stage: repair
    name: value_grounding
    module: plugins.repair.value_grounding

  - stage: repair
    name: execution_repair
    module: plugins.repair.execution_repair
    config:
      max_repairs: 2

  - stage: repair
    name: join_repair
    module: plugins.repair.join_repair

  - stage: repair
    name: column_grounding
    module: plugins.repair.column_grounding

  - stage: repair
    name: e3v_enhanced
    module: plugins.repair.e3v_enhanced

  - stage: repair
    name: e5_det_rules
    module: plugins.repair.e5_det_rules

  # Stage 3: Judge (2 plugins: first pool + second pool)
  - stage: judge
    name: route_a_tournament
    module: plugins.judge.route_a
    config:
      pool: runs/merged4model_n8_pool_scored_20260729.jsonl
      top_k: 12
      max_tokens: 1024

  - stage: judge
    name: multigen
    module: plugins.judge.multigen
    config:
      pool: runs/triple_merged_scored_pool.jsonl
      top_k: 12
      max_tokens: 1024

  # Stage 4: Regeneration (3 plugins)
  - stage: regen
    name: deep_regen
    module: plugins.regen.deep_regen
    config:
      max_repairs: 3

  - stage: regen
    name: preference_guided
    module: plugins.regen.preference_guided

  - stage: regen
    name: result_critique
    module: plugins.regen.result_critique
